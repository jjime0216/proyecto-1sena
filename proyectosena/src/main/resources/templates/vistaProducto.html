<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi primer proyecto</title>
    <link rel="stylesheet" href="../css/proyecto.css">
</head>
<body>
    <!-- Encabezado de la pagina  -->
    <header class="headerIndex">
        <!-- Barra de busqueda -->
        <div class="divIndex">
                <input type="text" placeholder="Buscar..." class="inputIndex">
                <button class="btn16"><img src="../img/glassIcon.png" alt="" class="imgIndex2"></button>
        </div>

        <div class="divIndex2">
            <!-- <a href="html/inicioSesion.html" class="aIndex2">Iniciar sesion</a>
            <a href="html/registro.html" class="aIndex2">Registrarse</a> -->
            <a th:href="@{/logout}">Cerrar sesión</a>
        </div>
    </header>
    <!-- Vista amplia y detallada en caso de seleccionar un producto -->
    <form action="" class="formP7">
        <button class="btn18"><a th:href="@{/home}" class="aP7">Regresar</a></button>
        <div class="divP7">
            <div class="">
                <img src="../img/fotoPantalla7.jpg" alt="imagen producto" th:src="@{/imagen/{nombreArchivo}(nombreArchivo=${producto.fotografia})}" class="imgP7">
            </div>
            <div class="desP7">
                <h2 th:text="${producto.nombreProducto}">Nombre producto</h2>
                <p class="pP7">Precio</p>
                <p class="pP7" th:text="${producto.costoProducto}">0</p>
                <label>Descripción</label>
                <p class="pDesP7" th:text="${producto.descripcionProducto}"></p>
                <label for="">Cantidad</label><input type="number" class="inputP7"><br>
                <div class="btnDiv">
                    <button class="btn19">Agregar a el carrito</button>
                    <button class="btn19">Comprar ahora</button>
                </div>
            </div>
        </div>
    </form>
    <!-- Pie de pagina o footer para enlaces a pantalla adicionales -->
    <h3 class="mapa">Mapa de navegacion</h3>
    <footer>
        <div class="divfooter">
            <label for="">Acerca de</label><br>
            <a href="index.html">Inicio</a><br>
            <a href="/html/inicioSesion.html">Iniciar sesion</a>
        </div>
        <div class="divfooter">
            <label for="###">Vendedor</label><br>
            <a href="/html/registroArticulo.html">Ingresar producto nuevo</a><br>
            <a href="/html/ingresarMetodoPago.html">Medios de pago</a><br>
            <a href="/html/ingresarMetodoPago2.html">Confirmacion pagos</a><br>
        </div>
        <div class="divfooter">
            <label for="">Redes Sociales</label><br>
            <a href="https://x.com">X</a><br>
            <a href="https://www.facebook.com/">Facebook</a><br>
            <a href="https://www.instagram.com">Instagram</a><br>
            <a href="https://www.youtube.com/">Youtube</a><br>
        </div>
        <div class="divfooter">
            <label for="">Cliente</label><br>
            <a href="/html/entregaPedido.html">Datos de entrega</a><br>
            <a href="/html/registro.html">Registrate</a><br>
        </div>
    </footer>
</body>
</html>
